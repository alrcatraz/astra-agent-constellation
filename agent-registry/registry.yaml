# Agent Registry — PRIVATE COPY (real values).
#
# This file is the private deployment copy of the agent registry. It holds
# REAL hostnames, versions and channel assignments and MUST NEVER be pushed
# to the public copy (GitHub). The public template lives at
# templates/agent-registry/registry.yaml.example (all placeholders).
#
# Validation: python3 scripts/registry-check.py --private agent-registry/registry.yaml
# Maintained by the orchestrator (deferred from guardian while no carrier
# device exists — PLAN.md). British English.
#
# FIELD SEMANTICS — reference, not copy (ADR 0001, section 1; 06 §5):
#   host    -> device-ref, resolves against the device/connection layer
#   model   -> tier-ref, resolves against the model config layer (L2)
#   channel -> chan-ref, resolves against the channel registration
#   owner   -> agent-ref, must point at another agent in THIS registry
#
# MODEL TIERS (tier-ref semantics, see 06 §5):
#   standard -> full-capability tier: primary model + complete fallback chain
#   light    -> cost/speed tier: lighter model for routine tasks
#   The concrete models behind each tier live in the model config layer (L2),
#   NOT here — this registry only names the tier.

meta:
  constellation: astra-agent-constellation
  registry_version: 1.1.0
  maintainer: alrcatraz

agents:
  - name: angelia
    role: orchestrator
    host: HomeCentre01            # device-ref -> HC01 (Hermes primary instance)
    model: standard                # tier-ref -> L2 model config layer
    channel: desktop               # chan-ref -> primary UI (Hermes Desktop / TUI)
    owner: tyche                   # agent-ref -> deferred, no carrier device yet
    version: v0.19.1               # hermes --version, verified 2026-08-05
    patches: []
    deploy_def: docs/07-adoption.md#phase-1
    health_check:
      type: command                # HC01 Hermes has no fixed listening port
      target: "hermes --version"
    restart:
      ref: docs/07-adoption.md#phase-1

  - name: executor-hc01
    role: executor
    host: HomeCentre01            # device-ref (same machine as orchestrator)
    model: light                  # tier-ref -> lighter cost/speed tier
    owner: angelia                # agent-ref
    version: 1.18.15              # opencode, official installer (~/.opencode/bin/opencode)
    patches: []
    deploy_def: docs/07-adoption.md#phase-1
    health_check:
      type: command
      target: "opencode --version"
    restart:
      ref: docs/07-adoption.md#phase-1

  - name: executor-susetlearn00
    role: executor
    host: SUSETLearn00            # device-ref (build machine, SSH 2222)
    model: light                  # tier-ref -> lighter cost/speed tier
    owner: angelia                # agent-ref
    version: 1.18.15              # opencode, official installer (~/.opencode/bin/opencode)
    patches: []
    deploy_def: docs/07-adoption.md#phase-2
    health_check:
      type: command
      target: "opencode --version"
    restart:
      ref: docs/07-adoption.md#phase-2

  # guardian — tyche: deferred (no carrier device, PLAN.md).
  # Blueprint requires an independent physical machine (ADR 0003, fault-domain
  # isolation). Register when hardware is available, in this order:
  # real registry -> cron trigger chain -> guardian skill -> Game Day variant A.
  # Planned channel: Matrix (bot account not yet provisioned).
  - name: tyche
    role: guardian
    host: unassigned             # device-ref -> no carrier device yet
    model: light                 # tier-ref -> stable, independent upgrade track
    channel: matrix              # chan-ref -> planned; bot account not provisioned
    owner: angelia               # agent-ref -> orchestrator maintains guardian (06 §8)
    version: uninstalled         # deferred until a carrier device exists
    patches: []
    deploy_def: docs/06-gemini-pattern.md#5
    health_check:
      type: command
      target: "false"            # placeholder: always failing while unassigned
    restart:
      ref: docs/06-gemini-pattern.md#6
